# Clavix on one host: api, ui, mongo (one-node replica set: transactions),
# redis and caddy (the only published ports: 80 and 443).
#
#   cp deploy/.env.example deploy/.env   # then fill it; it is never committed
#   docker compose -f deploy/compose.yml --env-file deploy/.env up -d
#
# Every service has CPU and memory limits (deploy.resources.limits), sized to
# its use with headroom, so one service can never starve the host.
#
# See docs/operations.md. Images are never built by CI here: build and tag them
# yourself (`docker build -t "$CLAVIX_API_IMAGE" .`).

name: clavix

x-restart: &restart
  restart: unless-stopped

# The off-host backup copy (S3-compatible storage); all empty = off.
x-offsite: &offsite
  BACKUP_OFFSITE_S3_BUCKET: ${BACKUP_OFFSITE_S3_BUCKET:-}
  BACKUP_OFFSITE_S3_ENDPOINT: ${BACKUP_OFFSITE_S3_ENDPOINT:-}
  BACKUP_OFFSITE_S3_REGION: ${BACKUP_OFFSITE_S3_REGION:-}
  BACKUP_OFFSITE_S3_ACCESS_KEY_ID: ${BACKUP_OFFSITE_S3_ACCESS_KEY_ID:-}
  BACKUP_OFFSITE_S3_SECRET_ACCESS_KEY: ${BACKUP_OFFSITE_S3_SECRET_ACCESS_KEY:-}
  BACKUP_OFFSITE_S3_PREFIX: ${BACKUP_OFFSITE_S3_PREFIX:-}
  BACKUP_OFFSITE_KEEP_DAYS: ${BACKUP_OFFSITE_KEEP_DAYS:-}

services:
  api:
    <<: *restart
    image: ${CLAVIX_API_IMAGE:?set CLAVIX_API_IMAGE in deploy/.env}
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      MONGO_URI: &mongo-uri mongodb://${MONGO_APP_USER:-clavix}:${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD}@mongo:27017/clavix?replicaSet=rs0&authSource=clavix${MONGO_URI_OPTIONS:-}
      # The api gets the whole .env (env_file) but needs none of the database admin secrets.
      MONGO_ROOT_USER: ""
      MONGO_ROOT_PASSWORD: ""
      MONGO_KEYFILE: ""
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      # Caddy is the one proxy in front.
      CLAVIX_TRUSTED_PROXIES: "1"
    # No `ports`: the api is reachable by caddy and the ui on the private network only.
    expose: ["3000"]
    volumes:
      # CA of the mongo certificate, for MONGO_URI_OPTIONS (docs/operations.md, "MongoDB").
      - ${MONGO_TLS_DIR:-./tls}/ca:/etc/mongo-tls-ca:ro
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    stop_grace_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  ui:
    <<: *restart
    image: ${CLAVIX_UI_IMAGE:?set CLAVIX_UI_IMAGE in deploy/.env}
    # No env_file: the ui never sees the api's secrets (master key, ask secret...).
    environment:
      CLAVIX_DOMAIN: ${CLAVIX_DOMAIN:?set CLAVIX_DOMAIN}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      NODE_ENV: production
      PORT: "3001"
      API_URL: http://api:3000/graphql
      TRUSTED_PROXIES: "1"
      # Required by the console: the compose file refuses to start the ui until
      # both are set (docs/operations.md, "First boot": bring the ui up last).
      CONSOLE_CLIENT_SECRET: ${CONSOLE_CLIENT_SECRET:?set CONSOLE_CLIENT_SECRET}
      CONSOLE_SESSION_SECRET: ${CONSOLE_SESSION_SECRET:?set CONSOLE_SESSION_SECRET}
    expose: ["3001"]
    depends_on:
      api: { condition: service_healthy }
    # The image's healthcheck test stays; only the timings change. The ui boots
    # in about 2 minutes (50 % CPU, ~425 MiB) before it settles.
    healthcheck:
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 5s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }

  mongo:
    <<: *restart
    image: mongo:8
    # Replica set, key file and optional TLS: deploy/mongo/entrypoint.sh.
    entrypoint: ["sh", "/mongo/entrypoint.sh"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}
      MONGO_KEYFILE: ${MONGO_KEYFILE:?set MONGO_KEYFILE}
      MONGO_APP_USER: ${MONGO_APP_USER:-clavix}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD}
    expose: ["27017"]
    volumes:
      - mongo-data:/data/db
      - ./mongo/entrypoint.sh:/mongo/entrypoint.sh:ro
      - ./mongo/healthcheck.sh:/mongo/healthcheck.sh:ro
      - ./mongo/init-app-user.js:/docker-entrypoint-initdb.d/init-app-user.js:ro
      - ${MONGO_TLS_DIR:-./tls}/server:/etc/mongo-tls:ro
    # Light check (a file and a TCP connection, no mongosh): deploy/mongo/healthcheck.sh.
    healthcheck:
      test: ["CMD", "bash", "/mongo/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    # The WiredTiger cache is capped at 0.25 GB in entrypoint.sh, inside this limit.
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  redis:
    <<: *restart
    image: redis:7-alpine
    # The password comes from the environment, so it is not in the process list.
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --maxmemory 192mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"
    expose: ["6379"]
    volumes:
      - redis-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 2s
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256M }

  caddy:
    <<: *restart
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CLAVIX_DOMAIN: ${CLAVIX_DOMAIN:?set CLAVIX_DOMAIN}
      CLAVIX_TLS_ASK_SECRET: ${CLAVIX_TLS_ASK_SECRET:?set CLAVIX_TLS_ASK_SECRET}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - ui
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  # `docker compose --profile tools run --rm backup` / `restore <file>`:
  # mongodump and mongorestore against the mongo service (docs/operations.md).
  backup:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: deploy/tools.Dockerfile
      secrets: [npm_read]
    entrypoint: ["bun"]
    command: ["/scripts/mongo-backup.js", "/backups"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }
    # Not root: the archives belong to the host user that owns BACKUP_DIR
    # (BACKUP_UID / BACKUP_GID, default 1000:1000; `export BACKUP_UID=$(id -u)
    # BACKUP_GID=$(id -g)` for any other). Create the folder first, as that user.
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    environment:
      HOME: /tmp
      MONGO_URI: *mongo-uri
      KEEP: ${BACKUP_KEEP:-14}
      # Off-host copy, opt-in: empty bucket = off (docs/operations.md, "Off-host copies").
      <<: *offsite
    volumes:
      - ${BACKUP_DIR:-../backups}:/backups
      - ${MONGO_TLS_DIR:-./tls}/ca:/etc/mongo-tls-ca:ro
    depends_on:
      mongo: { condition: service_healthy }

  restore:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: deploy/tools.Dockerfile
      secrets: [npm_read]
    entrypoint: ["bun", "/scripts/mongo-restore.js"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }
    environment:
      MONGO_URI: *mongo-uri
      CONFIRM: ${CONFIRM:-}
      <<: *offsite
    volumes:
      - ${BACKUP_DIR:-../backups}:/backups:ro
      - ${MONGO_TLS_DIR:-./tls}/ca:/etc/mongo-tls-ca:ro
    depends_on:
      mongo: { condition: service_healthy }

# The read token for @softistx installs at build time (a BuildKit secret, never
# in an image layer); empty or unset while the packages are public.
secrets:
  npm_read:
    environment: NPM_SOFTISTX_READ_TOKEN

volumes:
  mongo-data:
  redis-data:
  caddy-data:
  caddy-config:
