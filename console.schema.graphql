schema {
  query: Query
  mutation: Mutation
}

"""
Validates an argument or an input field when the request arrives, before the resolver runs. A value that breaks a constraint is refused with a BAD_USER_INPUT error whose extensions list each issue with its path and the constraint that refused it; null and omitted values are not checked. Each argument below is one constraint, and they combine on one field.
"""
directive @constraint(
  """
  The string must contain this text (case-sensitive). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to String and ID values.
  """
  contains: String
  """
  The string must end with this text (case-sensitive). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to String and ID values.
  """
  endsWith: String
  """
  The number must be strictly less than this value (the value itself is refused). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to Int and Float values.
  """
  exclusiveMax: Float
  """
  The number must be strictly greater than this value (the value itself is refused). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to Int and Float values.
  """
  exclusiveMin: Float
  """
  The string must match this named format: byte, date, date-time, email, ipv4, ipv6, uri or uuid, or a format the server registered. An unknown name fails at server startup. Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to String and ID values.
  """
  format: String
  """
  The number must be less than or equal to this value (inclusive). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to Int and Float values.
  """
  max: Float
  """
  The list must hold at most this many items (inclusive). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to list values.
  """
  maxItems: Int
  """
  The string must be at most this many characters long (UTF-16 code units, inclusive). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to String and ID values.
  """
  maxLength: Int
  """
  The number must be greater than or equal to this value (inclusive). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to Int and Float values.
  """
  min: Float
  """
  The list must hold at least this many items (inclusive). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to list values.
  """
  minItems: Int
  """
  The string must be at least this many characters long (UTF-16 code units, inclusive). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to String and ID values.
  """
  minLength: Int
  """
  The number must be a whole multiple of this value (for example 5 accepts 0, 5 and 10). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to Int and Float values.
  """
  multipleOf: Float
  """
  The string must not contain this text (case-sensitive). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to String and ID values.
  """
  notContains: String
  """
  The string must match this regular expression (JavaScript syntax, not anchored unless it uses ^ and $). An invalid expression fails at server startup. Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to String and ID values.
  """
  pattern: String
  """
  The string must start with this text (case-sensitive). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to String and ID values.
  """
  startsWith: String
) on ARGUMENT_DEFINITION | INPUT_FIELD_DEFINITION

"""
The cost of a field, type, enum, scalar, argument or input field in the query cost limit, following the IBM GraphQL cost specification.
"""
directive @cost(
  """
  The cost it adds; it replaces the default object or scalar cost for what it marks, and on a field it is added once, not per list item.
  """
  weight: Int!
) on ARGUMENT_DEFINITION | ENUM | FIELD_DEFINITION | INPUT_FIELD_DEFINITION | OBJECT | SCALAR

"""
Directs the executor to defer this fragment when the `if` argument is true or undefined.
"""
directive @defer(
  """Deferred when true or undefined."""
  if: Boolean! = true
  """Unique name"""
  label: String
) on FRAGMENT_SPREAD | INLINE_FRAGMENT

"""
How many items a list field returns, used to multiply its cost in the query cost limit, following the IBM GraphQL cost specification.
"""
directive @listSize(
  """
  The list size to assume when no slicing argument gives one; it defaults to the server limits.cost.defaultListSize (10 unless configured) and it also sizes the inner levels of a nested list.
  """
  assumedSize: Int
  """
  Whether a request must give a non-negative integer for at least one slicing argument, otherwise it is rejected; true by default.
  """
  requireOneSlicingArgument: Boolean = true
  """
  The fields of the returned object that hold the list (for example the edges of a connection), each sized like this field instead of once.
  """
  sizedFields: [String!]
  """
  The names of the arguments (a dotted path reaches into an input) whose non-negative integer value is the list size; the largest given one is used.
  """
  slicingArguments: [String!]
) on FIELD_DEFINITION

"""
Directs the executor to stream plural fields when the `if` argument is true or undefined.
"""
directive @stream(
  """Stream when true or undefined."""
  if: Boolean! = true
  """Number of items to return immediately"""
  initialCount: Int! = 0
  """Unique name"""
  label: String
) on FIELD

"""What a console admin did (ADR-0037): one recorded action."""
type AdminEvent {
  """The action, `<noun>.<verb>`."""
  action: String!
  actor: AuditActor!
  at: DateTime!
  id: ID!
  requestId: String!
  target: AuditTarget!
  """The tenant it was about; `null` for an action on the platform itself."""
  tenantId: ID
}

"""Every field narrows the events and they combine with AND."""
input AdminEventFilter {
  """One action, exactly (`user.invite`)."""
  action: String
  """The id of the admin who did it."""
  actor: String
  from: DateTime
  to: DateTime
}

"""
A page of admin events, newest first; `nextCursor` is `null` on the last.
"""
type AdminEventPage {
  items: [AdminEvent!]!
  nextCursor: String
  """How many events match the filter in all, not the page's size."""
  totalCount: Int!
}

"""
A pending invitation to administer a tenant. The code only goes by e-mail.
"""
type AdminInvitation {
  email: EmailAddress!
  expiresAt: DateTime!
  id: ID!
  invitedAt: DateTime!
  """
  The operator who invited (the first sender; a resend keeps it). Null when a script did.
  """
  invitedBy: Inviter
  role: Role!
}

"""
How the tenant's agents (MCP clients and other apps) may register themselves.
"""
enum AgentRegistrationMode {
  """
  No dynamic registration: `/register` answers `invalid_request` and discovery shows no `registration_endpoint`.
  """
  OFF
  """
  Registration accepts any valid redirect URI. Anyone can create clients, bounded by the plan's `agents` quota and the registration throttle.
  """
  OPEN
  """
  Registration at `/register` (RFC 7591) accepts the redirect URIs of the known MCP clients (Claude, ChatGPT, Cursor, VS Code, ...) and `agents.redirectUris`.
  """
  RESTRICTED
}

"""Who an attribute describes."""
enum AttributeFamily {
  """Only the holders of the roles the attribute is linked to."""
  ROLE
  """Every user of the tenant."""
  USER
}

"""
Which section a save is about: `roleId` null for the general section. A role
section needs the role links (a later release): a `roleId` is refused with
ATTRIBUTE_ROLE_NOT_HELD until then.
"""
input AttributeSectionInput {
  roleId: ID
}

"""What an attribute holds. Its values are canonical per type."""
enum AttributeType {
  BOOLEAN
  COLOR
  DATE
  DATETIME
  MULTI_SELECT
  NUMBER
  SELECT
  STRING
  TEXT
  TIME
}

"""
One attribute of a user's section and the value the user holds. Exactly the
field of the attribute's type is set (`text` for STRING and TEXT, `color`,
`number`, `date`, `dateTime`, `time`, `options` for SELECT and MULTI_SELECT,
`boolean`); every field is `null` while the user holds no value.
"""
type AttributeValue {
  attribute: UserAttribute!
  boolean: Boolean
  color: HexColorCode
  date: Date
  dateTime: DateTime
  number: Float
  """The keys of the chosen options (one for SELECT)."""
  options: [String!] @listSize(assumedSize: 20, requireOneSlicingArgument: false)
  text: String
  time: LocalTime
}

"""One change of a save: `value` null clears the attribute's value."""
input AttributeValueInput {
  attributeId: ID!
  value: AttributeValueSetInput
}

"""
The value to set, through the one field of the attribute's type (`text` for
STRING and TEXT, `color`, `number`, `date`, `dateTime`, `time`, `options` for
SELECT and MULTI_SELECT, `boolean`).
"""
input AttributeValueSetInput @oneOf {
  boolean: Boolean
  color: HexColorCode
  date: Date
  dateTime: DateTime
  number: Float
  options: [String!]
  text: String
  time: LocalTime
}

"""
Who did it, resolved to a name and an e-mail address when the party is a user
who still exists; `name` and `email` are `null` otherwise (gone, a client, the
system, or a failed sign-in that named nobody).
"""
type AuditActor {
  email: EmailAddress
  id: String!
  kind: AuditActorKind!
  name: String
}

"""What kind of party did something."""
enum AuditActorKind {
  client
  system
  user
}

"""What an admin event was done to: a kind and an id, never a value."""
type AuditTarget {
  id: String!
  type: String!
}

"""
What a tenant's users did to their own access (D12): a sign-in or sign-out, a
second factor or passkey change, a step-up. The full address is kept for the
tenant's retention period only.
"""
type AuthEvent {
  actor: AuditActor!
  at: DateTime!
  clientId: String
  id: ID!
  """The client address, in full; `null` when the source has none."""
  ip: String
  method: AuthMethod
  outcome: AuthOutcome!
  """Why a failure failed: a code, never a message."""
  reason: String
  requestId: String!
  """
  `<noun>.<verb>`, one of the closed list (`session.signIn`, `passkey.added`, …).
  """
  type: String!
  """The browser or tool family (`Firefox`), never the whole User-Agent."""
  userAgent: String
  userId: String
}

"""Every field narrows the events and they combine with AND."""
input AuthEventFilter {
  clientId: String
  from: DateTime
  outcome: AuthOutcome
  to: DateTime
  """
  Event types to keep; each must be one of the closed list, else a `BAD_USER_INPUT`.
  """
  types: [String!]
  userId: String
}

"""
A page of a tenant's sign-in events, newest first; `nextCursor` is `null` on the last.
"""
type AuthEventPage {
  items: [AuthEvent!]!
  nextCursor: String
  """How many events match the filter in all, not the page's size."""
  totalCount: Int!
}

"""How a user proved who they are."""
enum AuthMethod {
  emailCode
  magicLink
  passkey
  recoveryCode
  social
  totp
}

enum AuthOutcome {
  failure
  success
}

"""Standard base64 with padding, in its canonical spelling."""
scalar Base64 @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc4648#section-4")

"""URL-safe base64 without padding, in its canonical spelling."""
scalar Base64URL @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc4648#section-5")

"""
An integer of any size, as a decimal string (a safe-integer number is accepted as input).
"""
scalar BigInt

"""
A tenant's brand: the theme its hosted pages wear. The colours are checked
against WCAG AA in light and dark before anything is stored.
"""
type Branding {
  """A background preset id of @softistx/material-core, or null."""
  backgroundPreset: String
  """The generated stylesheet (`themeToCss`, attribute scope)."""
  css: String!
  displayName: String!
  """Where the logo is served on the tenant's host; null without a logo."""
  logoUrl: String
  """A motif shape id of @softistx/material-core, or null."""
  motif: String
  """A CSS length in rem or px."""
  radius: String!
  """The brand's primary colour, as given."""
  seed: String!
  tenantId: ID!
  """The `data-nxgt-theme` value the CSS is scoped to."""
  themeName: String!
  updatedAt: DateTime
}

input BrandingLogoInput {
  """image/png, image/jpeg or image/webp."""
  contentType: String!
  """The image bytes, base64, at most 256 KiB decoded."""
  dataBase64: String!
}

"""An IPv4 block in CIDR notation, such as 10.0.0.0/8."""
scalar CIDRv4 @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc4632")

"""An IPv6 block in CIDR notation, such as 2001:db8::/32."""
scalar CIDRv6 @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc4291")

"""The candidate of `checkConnection`: a connection that is not saved."""
input CheckConnectionInput {
  claims: ConnectionClaimsInput
  clientAuthentication: ConnectionClientAuthentication
  clientId: String!
  clientSecret: String!
  emailTrust: ConnectionEmailTrust
  id: ID!
  idTokenSignedResponseAlg: ConnectionAlgorithm
  issuer: String!
  scopes: [String!]
}

"""An OAuth client of a tenant."""
type Client {
  """
  The scopes the client may ask for with `CLIENT_CREDENTIALS`: a request is cut
  to them. Empty without that grant.
  """
  allowedScopes: [String!]!
  """
  The authorization detail types (RFC 9396, `Resource.detailTypes`) the client
  may ask for; empty when it lists none. Never implied.
  """
  authorizationDetailsTypes: [String!]!
  createdAt: DateTime!
  """
  The scopes a `CLIENT_CREDENTIALS` request with no `scope` gets (within `allowedScopes`).
  """
  defaultScopes: [String!]!
  """
  Whether the client's token requests must carry a DPoP proof (RFC 9449): its
  access tokens are bound to its key, and a public client's refresh token too.
  A tenant that requires DPoP of everyone (`oauthPolicy.dpop.required`)
  overrides this: every client sends a proof.
  """
  dpopBoundAccessTokens: Boolean!
  """
  The grant types the client may use, enforced by the token and device
  authorization endpoints (`unauthorized_client` for another).
  `AUTHORIZATION_CODE` and `REFRESH_TOKEN` when the client records none.
  """
  grantTypes: [ClientGrantType!]!
  """The client_id."""
  id: ID!
  name: String!
  """
  Exact-match redirect URIs. Empty for a device-only client (no `AUTHORIZATION_CODE`).
  """
  redirectUris: [String!]!
  """
  How the client came to be: `createdAt` is its registration time. An agent (`DYNAMIC`, `METADATA`) is read-only in the console and can be deleted.
  """
  registration: ClientRegistration!
  """
  Whether the client must push its authorization requests to `/par` (RFC 9126).
  A tenant that requires it of everyone (`oauthPolicy.par.required`) overrides
  this: every client pushes.
  """
  requirePushedAuthorizationRequests: Boolean!
  """
  The token exchange rules; `null` while none is set (the client cannot exchange).
  """
  tokenExchange: ClientTokenExchange
  type: ClientType!
}

"""A grant type recorded on a client."""
enum ClientGrantType {
  AUTHORIZATION_CODE
  """
  The client credentials grant (RFC 6749 section 4.4): a back end asks for an access token of its own, with no user. For a confidential client only, never implied, with `allowedScopes`, and served only for a resource that opted in (`Resource.allowClientCredentials`).
  """
  CLIENT_CREDENTIALS
  """
  The device authorization grant (RFC 8628, `urn:ietf:params:oauth:grant-type:device_code`), for a CLI or a TV. Never implied: a client opts in.
  """
  DEVICE_CODE
  REFRESH_TOKEN
  """
  The token exchange grant (RFC 8693, `urn:ietf:params:oauth:grant-type:token-exchange`), for a confidential back end. Never implied, and refused until `setClientTokenExchange` sets the client's rules.
  """
  TOKEN_EXCHANGE
}

"""
A page of a tenant's clients; `nextCursor` is `null` on the last. A page may
hold fewer than `first` items, even none, with a `nextCursor` (a search with
`q` does): follow it until it is `null`.
"""
type ClientPage {
  items: [Client!]!
  nextCursor: String
  """
  How many clients match `q` in all (every client without it), whatever the cursor or the page's size.
  """
  totalCount: Int!
}

"""
How a client came to be. `DYNAMIC` and `METADATA` are the tenant's agents (MCP
clients and other apps that registered themselves, see `OAuthPolicy.agents`).
"""
enum ClientRegistration {
  """Registered by an admin in the console or by a script."""
  CONSOLE
  """The client registered itself at `/register` (RFC 7591)."""
  DYNAMIC
  """
  A Client ID Metadata Document (its URL is the client id) describes the client; recorded at its first use.
  """
  METADATA
}

"""
What a client may do with the token exchange grant. Default-deny: a client with
no rules cannot exchange. The exchanged token's scopes only narrow the subject
token's, it has no refresh token, and it never outlives the subject token.
"""
type ClientTokenExchange {
  """Whether a token of any client of the tenant may be exchanged."""
  anySubjectClient: Boolean!
  mode: TokenExchangeMode!
  """
  Whether the tokens of any agent of the tenant (a client that registered itself) may be exchanged too. A client that is no agent is not covered.
  """
  subjectAgents: Boolean!
  """
  Ids of the clients whose tokens may be exchanged. Empty with `anySubjectClient`.
  """
  subjectClients: [String!]!
  """URIs of the tenant's resources the exchanged token may be issued for."""
  targetResources: [String!]!
}

"""
The rules of `setClientTokenExchange`: they replace the client's current ones.
"""
input ClientTokenExchangeInput {
  """Any client of the tenant's tokens may be exchanged. Default false."""
  anySubjectClient: Boolean = false
  """
  Also exchange the tokens of the tenant's agents, with or without `subjectClients`. Default false.
  """
  subjectAgents: Boolean = false
  """
  The ids of the clients whose tokens may be exchanged (at most 50). Leave empty with `anySubjectClient`.
  """
  subjectClients: [String!] = []
  """Resource URIs of the tenant. Empty: the client can exchange for none."""
  targetResources: [String!]!
}

"""
Whether a client keeps a secret (a back end) or proves itself with PKCE only.
"""
enum ClientType {
  CONFIDENTIAL
  PUBLIC
}

"""
A tenant's enterprise OpenID Connect connection: its own identity provider,
signed in to through the hosted sign-in. The client secret is sealed and is
never returned.
"""
type Connection {
  claims: ConnectionClaims!
  clientAuthentication: ConnectionClientAuthentication
  clientId: String!
  createdAt: DateTime!
  domains: [ConnectionDomain!]!
  emailTrust: ConnectionEmailTrust!
  enabled: Boolean!
  """
  The connection's name in links and events: `[a-z][a-z0-9-]{0,31}`, for ever.
  """
  id: ID!
  idTokenSignedResponseAlg: ConnectionAlgorithm
  """
  `https` issuer URL; its discovery document is read. Fixed once accounts are linked.
  """
  issuer: String!
  """
  A user is created at the first sign-in, where the tenant's sign-up is open (D5).
  """
  jit: Boolean!
  name: String!
  """
  The redirect URI to register at the identity provider: this connection's own callback on the tenant's sign-in host (`<issuer>/sign-in/social/<id>/callback`).
  """
  redirectUri: String!
  """A verified domain of this connection signs in through it only (D4)."""
  requireSso: Boolean!
  """Rises on every change."""
  revision: Int!
  """Absent: `openid email profile`."""
  scopes: [String!]
  """Also offer a button on the sign-in page."""
  showButton: Boolean!
  updatedAt: DateTime!
  """
  The `acr` the identity provider must report (D6). Stored; not enforced yet.
  """
  upstreamMfa: ConnectionUpstreamMfa
}

"""
The ID token signature algorithms a connection accepts: asymmetric only.
"""
enum ConnectionAlgorithm {
  ES256
  ES384
  ES512
  EdDSA
  PS256
  PS384
  PS512
  RS256
  RS384
  RS512
}

"""What a successful `checkConnection` read."""
type ConnectionCheck {
  authorizationEndpoint: String!
  issuer: String!
}

"""
The names of the ID token claims that fill the identity; a claim left out keeps
its standard name. The protocol claims (`sub`, `iss`, `aud`, `nonce`, ...)
cannot be named.
"""
type ConnectionClaims {
  email: String
  emailVerified: String
  name: String
  picture: String
}

input ConnectionClaimsInput {
  email: String
  emailVerified: String
  name: String
  picture: String
}

"""How the client secret reaches the identity provider's token endpoint."""
enum ConnectionClientAuthentication {
  BASIC
  POST
}

"""
An e-mail domain of a connection. It signs in through the connection only once
verified: publish `txtToken` as a TXT record at `txtName`, then call
`verifyConnectionDomain`.
"""
type ConnectionDomain {
  checkedAt: DateTime
  """Lowercase, punycode."""
  domain: String!
  """`_clavix-sso.<domain>`."""
  txtName: String!
  txtToken: String!
  verified: Boolean!
  verifiedAt: DateTime
}

type ConnectionDomainCheck {
  connection: Connection!
  verified: Boolean!
}

"""
How an identity provider's e-mail counts as proven. CLAIM_AND_DOMAIN: the
`email_verified` claim is true and the address is in a verified domain of the
connection. DOMAIN: the address is in a verified domain (for providers that do
not send the claim). The claim alone is not offered: it would let the identity
provider assert any address.
"""
enum ConnectionEmailTrust {
  CLAIM_AND_DOMAIN
  DOMAIN
}

type ConnectionUpstreamMfa {
  acr: String!
}

input ConnectionUpstreamMfaInput {
  acr: String!
}

"""A signed-in console user: a user of the `clavix` tenant."""
type ConsoleUser {
  email: EmailAddress!
  id: ID!
  name: String
}

"""An ISO 3166-1 alpha-2 country code, such as FR."""
scalar CountryCode @specifiedBy(url: "https://www.iso.org/iso-3166-country-codes.html")

input CreateClientInput {
  """
  The scopes the client may ask for with `CLIENT_CREDENTIALS` (at least one with that
  grant, BAD_USER_INPUT otherwise; without the grant none is allowed).
  """
  allowedScopes: [String!]
  """
  The detail types the client may ask for: the names of the tenant's types.
  BAD_USER_INPUT for an unknown type, or without `requirePushedAuthorizationRequests`
  (details in a URL are not protected). Default: none.
  """
  authorizationDetailsTypes: [String!]
  """
  The client_id (a-z, 0-9, `-`); default: the name. Creating an existing id is a CONFLICT, unless the call repeats it (same name, type and redirect URIs).
  """
  clientId: String
  """
  The scopes a request with no `scope` gets: within `allowedScopes`. Default: none.
  """
  defaultScopes: [String!]
  """Bind the client's tokens to a DPoP key. Default false."""
  dpopBoundAccessTokens: Boolean
  """
  The grants the client may use. Default: `AUTHORIZATION_CODE` and `REFRESH_TOKEN`.
  A list needs `AUTHORIZATION_CODE`, `DEVICE_CODE`, `TOKEN_EXCHANGE` or `CLIENT_CREDENTIALS`; add
  `REFRESH_TOKEN` for a client that refreshes. Without `AUTHORIZATION_CODE` the client needs no
  redirect URI. `TOKEN_EXCHANGE` and `CLIENT_CREDENTIALS` need a `CONFIDENTIAL` client
  (BAD_USER_INPUT otherwise).
  """
  grantTypes: [ClientGrantType!]
  name: String!
  """
  At least one unless the client has no `AUTHORIZATION_CODE` grant (a device-only client needs none). Default: none.
  """
  redirectUris: [String!]
  """Make the client push its authorization requests. Default false."""
  requirePushedAuthorizationRequests: Boolean
  type: ClientType!
}

input CreateConnectionInput {
  claims: ConnectionClaimsInput
  clientAuthentication: ConnectionClientAuthentication
  clientId: String!
  """Sealed at once; never returned."""
  clientSecret: String!
  """Default CLAIM_AND_DOMAIN."""
  emailTrust: ConnectionEmailTrust
  """Default true."""
  enabled: Boolean
  """`[a-z][a-z0-9-]{0,31}`, not `google`, `github` or `microsoft`."""
  id: ID!
  idTokenSignedResponseAlg: ConnectionAlgorithm
  issuer: String!
  """Default true."""
  jit: Boolean
  name: String!
  """Default true."""
  requireSso: Boolean
  scopes: [String!]
  """Default false."""
  showButton: Boolean
  upstreamMfa: ConnectionUpstreamMfaInput
}

