  STEP_UP_REQUIRED otherwise, which the application's step-up answers (the
  authenticator app's code when the account has a second factor).
  """
  approveOAuthRequest(
    """
    The authorization details (RFC 9396) to allow, as a JSON array string of elements taken from `oauthRequest`, a subset of what the client asked for. Omit or pass null to allow all of them; `"[]"` allows none. The grant keeps exactly these. BAD_USER_INPUT when a detail was not asked for or was changed, when the request asked for none, or when the string breaks the limits every authorization details input has (8192 bytes, 16 details, 8 levels deep, no repeated key, numbers in the safe range) or is not a JSON array of objects; its message says the shape, never the value. Allowing neither a scope nor a detail (`scopes: []` with `"[]"`) is BAD_USER_INPUT.
