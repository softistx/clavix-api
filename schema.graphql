  account is made (e-mail proved) and what the invitation offers granted, once,
  and the session opens. A second use of the code, or an admin invitation whose
  tenant is gone, is INVITATION_INVALID, 400.
  """
  acceptInvitation(code: String!): AcceptedInvitation!
  """
  Checks the app's first code and makes the factor active; answers the recovery
  codes, once. CODE_INVALID, SECOND_FACTOR_NOT_ENROLLED, SECOND_FACTOR_DISABLED.
  """
  activateSecondFactor(code: String!): RecoveryCodes!
