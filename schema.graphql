    """
    authorizationDetails: String
    """
    The one object the access acts in. Omit or pass null for none. BAD_USER_INPUT when the server takes no bound object, or when it needs one and none is given; FORBIDDEN when the viewer may not bind access to it.
    """
    bound: OAuthBoundInput
    """
    The names of the scopes to allow, a subset of what the device asked for. Omit or pass null to allow all of them. A scope the device did not ask for answers NOT_FOUND, like an unknown code, so send scopes taken from `oauthDeviceRequest`.
    """
    scopes: [String!]
    """The code as the user typed it, such as `bcdf-ghjk`."""
    userCode: String!
