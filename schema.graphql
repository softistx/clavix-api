  string), and opens the session (cookie set). The five attempts are the ones
  of `confirmSecondFactor`: CODE_INVALID with `attemptsLeft` for an assertion
  that does not verify or names another user's passkey; TOKEN_UNKNOWN,
  TOKEN_SPENT, TOKEN_EXPIRED. `recoveryCodesLeft` is null.
